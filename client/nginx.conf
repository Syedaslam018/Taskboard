server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing (createBrowserRouter) - any path
    # that isn't a real static file falls back to index.html so refreshing
    # on e.g. /boards/abc123 doesn't 404 at the nginx layer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API and WebSocket traffic are proxied to the server container so
    # the browser only ever talks to one origin - avoids CORS entirely in
    # production and lets the refresh-token cookie's SameSite=Lax policy
    # work without cross-site complications.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
