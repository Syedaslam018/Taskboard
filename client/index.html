<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TaskBoard</title>
    <!--
      Applies the saved (or system) theme before first paint so there's no
      flash of the wrong background. Mirrors the key/logic in
      src/stores/themeStore.ts - keep the storage key in sync.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("taskboard-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored ? stored === "dark" : prefersDark;
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          /* localStorage unavailable (private mode) - default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
