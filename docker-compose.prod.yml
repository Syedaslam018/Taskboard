version: "3.9"

# Production compose file. Key differences from docker-compose.yml (dev):
# - No bind-mounted source volumes - the image is what runs, not a live
#   mount of the host's working directory, so a container always reflects
#   exactly what was built, not accidental local edits.
# - Server and client build from their production Dockerfiles (multi-stage,
#   compiled output only, non-root user, nginx for static serving).
# - MongoDB requires a persisted volume and auth in real deployments; the
#   simplified `mongo` service here is still fine for a single-host demo
#   deployment, but a managed MongoDB (Atlas) is the realistic choice for
#   an actual production environment - see the Deployment section of the
#   README.
# - Client is served on port 80 (nginx), not the Vite dev server, and nginx
#   proxies /api and /socket.io to the server container so the browser only
#   ever talks to one origin.
#
# Usage:
#   cp server/.env.example server/.env.production   # fill in real secrets
#   docker compose -f docker-compose.prod.yml --env-file server/.env.production up -d --build

services:
  mongo:
    image: mongo:7
    container_name: taskboard-mongo-prod
    restart: unless-stopped
    volumes:
      - mongo-data-prod:/data/db
    # Not exposing 27017 to the host in production - only the server
    # container (on the same Docker network) needs to reach it.

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskboard-server-prod
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/taskboard
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL must be set to the real deployed origin}
      COOKIE_SECURE: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: taskboard-client-prod
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mongo-data-prod:
